name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:

  # ============================================================
  # DETECT CHANGES
  # ============================================================

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      simworker: ${{ steps.filter.outputs.simworker }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'server/**'
              - 'docker-compose.prod.yml'

            frontend:
              - 'frontend/**'
              - 'shared/**'

            simworker:
              - 'sim-worker/**'
              - 'shared/**'
              - 'docker-compose.prod.yml'


  # ============================================================
  # BACKEND TESTS
  # ============================================================

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    needs:
      - changes

    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: server
        run: sh ./mvnw test


  # ============================================================
  # SIM WORKER TESTS
  # ============================================================

  sim-worker-test:
    name: Sim Worker Tests
    runs-on: ubuntu-latest

    needs:
      - changes

    if: needs.changes.outputs.simworker == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sim-worker/package-lock.json

      - name: Install sim-worker dependencies
        working-directory: sim-worker
        run: npm ci

      - name: Run sim-worker tests
        working-directory: sim-worker
        run: npm test


  # ============================================================
  # FRONTEND CHECK + BUILD
  # ============================================================

  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest

    needs:
      - changes

    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          # Vite embeds these public values at build time. Clean CI checkouts do
          # not include the ignored local frontend/.env files.
          VITE_API_BASE_URL: https://api.botfightonline.com
          VITE_CLIENT_BUILD_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1


  # ============================================================
  # BUILD + PUSH BACKEND IMAGE
  # ============================================================

  docker-build-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    needs:
      - changes
      - backend-test

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/botfight-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/botfight-backend:${{ github.sha }}


  # ============================================================
  # BUILD + PUSH SIM WORKER IMAGE
  # ============================================================

  docker-build-push-sim-worker:
    name: Build and Push Sim Worker Image
    runs-on: ubuntu-latest

    needs:
      - changes
      - sim-worker-test

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.simworker == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write engine version manifest
        working-directory: sim-worker
        run: node src/version.js --write

      - name: Build and push sim worker
        uses: docker/build-push-action@v6
        with:
          context: ./sim-worker
          build-contexts: |
            shared=./shared
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/botfight-sim-worker:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/botfight-sim-worker:${{ github.sha }}


  # ============================================================
  # DEPLOY BACKEND TO LIGHTSAIL
  # ============================================================

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - changes
      - docker-build-push
      - docker-build-push-sim-worker

    # Deploys when the backend, the sim worker, or both changed. A build skipped because its
    # change did not happen is fine. A build that failed or was cancelled, or one skipped
    # after a failed test, blocks the deploy.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.simworker == 'true') &&
      (needs.changes.outputs.backend != 'true' || needs.docker-build-push.result == 'success') &&
      (needs.changes.outputs.simworker != 'true' || needs.docker-build-push-sim-worker.result == 'success')

    steps:
      - name: Choose services to deploy
        id: services
        env:
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          SIM_WORKER_CHANGED: ${{ needs.changes.outputs.simworker }}
        run: |
          services=""
          if [ "$SIM_WORKER_CHANGED" = "true" ]; then services="sim-worker"; fi
          if [ "$BACKEND_CHANGED" = "true" ]; then services="${services:+$services }backend"; fi
          echo "services=$services" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}" > ~/.ssh/lightsail_key

          chmod 600 ~/.ssh/lightsail_key

          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Lightsail
        env:
          DEPLOY_SERVICES: ${{ steps.services.outputs.services }}
        run: |
          ssh \
            -i ~/.ssh/lightsail_key \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "DEPLOY_SERVICES='$DEPLOY_SERVICES' bash -s" << 'EOF'

          set -e

          cd /opt/botfight/bot-fight

          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id prod/botfight \
            --region us-east-2 \
            --query SecretString \
            --output text)

          export POSTGRES_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.POSTGRES_PASSWORD')
          export SPRING_DATASOURCE_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.SPRING_DATASOURCE_PASSWORD')
          export MAIL_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.MAIL_PASSWORD')
          export OAUTH_CLIENT_SECRET=$(echo "$SECRET_JSON" | jq -r '.OAUTH_CLIENT_SECRET')
          export SIM_WORKER_SECRET=$(echo "$SECRET_JSON" | jq -r '.SIM_WORKER_SECRET')

          if [ -z "$SIM_WORKER_SECRET" ] || [ "$SIM_WORKER_SECRET" = "null" ]; then
            echo "SIM_WORKER_SECRET is missing from prod/botfight" >&2
            exit 1
          fi

          chmod 600 docker-compose.prod.env

          docker compose \
            --env-file docker-compose.prod.env \
            -f docker-compose.prod.yml \
            pull $DEPLOY_SERVICES

          docker compose \
            --env-file docker-compose.prod.env \
            -f docker-compose.prod.yml \
            up -d --force-recreate $DEPLOY_SERVICES

          EOF


  # ============================================================
  # DEPLOY FRONTEND TO S3 + CLOUDFRONT
  # ============================================================

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - changes
      - frontend-check

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload frontend to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"