services:
    postgres-db:
        image: ${POSTGRES_IMAGE:-postgres:16}
        restart: unless-stopped
        env_file:
            - ./server/.env.prod
        expose:
            - "5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    backend:
        image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the published backend image}:${IMAGE_TAG:-latest}
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        env_file:
            - ./server/.env.prod
        environment:
            SPRING_PROFILES_ACTIVE: prod
            TZ: UTC
        ports:
            - "127.0.0.1:8080:8080"
        depends_on:
            postgres-db:
                condition: service_healthy

volumes:
    pgdata:
