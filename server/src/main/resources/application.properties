spring.application.name=botfight
# Spring Boot does not load .env automatically. This imports server/.env when
# the application is started with the server directory as its working directory.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ml_game_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mladmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
botfight.security.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
botfight.security.require-https=false
botfight.security.max-http-request-bytes=1048576
botfight.security.max-web-socket-message-bytes=65536
botfight.security.max-web-socket-send-buffer-bytes=4194304
botfight.security.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID:replace-with-your-local-client-id}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET:replace-with-your-local-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
botfight.mail.from=${MAIL_FROM:no-reply@example.test}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=2h
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.max-http-request-header-size=16KB
