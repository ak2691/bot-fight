<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint trail previews</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0b0f13; color: #e6edf3; font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .muted { color: #8b98a5; font-size: 13px; }
  canvas { width: 100%; height: 210px; border-radius: 10px; display: block; }
  .on { color: #5fd4f0; }
</style>
</head>
<body>
<div class="wrap">
  <p class="muted">Presentation preview only. The bot alternates: sprint 2.4 s, walk 1.6 s. Walk 150 u/s, sprint 225 u/s, shown at scale 0.42. Approved: <b>C</b>. A and B are kept for reference.</p>
  <p class="muted">State: <span id="state" style="font-family:Cousine,monospace">walking</span></p>
  <div class="grid">
    <div><canvas class="sc" data-k="dust"></canvas><p class="muted on">C: speed lines and dust (approved)</p></div>
    <div><canvas class="sc" data-k="wind"></canvas><p class="muted">A: wind streaks</p></div>
    <div><canvas class="sc" data-k="ghost"></canvas><p class="muted">B: afterimages</p></div>
  </div>
</div>
<script>
const H = 210, S = 0.42, R = 30 * S;
const views = [...document.querySelectorAll('.sc')].map(c => ({ c, ctx: c.getContext('2d'), k: c.dataset.k, w: 200, hist: [], parts: [], th: 0, spawn: 0 }));
function resize() { const d = window.devicePixelRatio || 1; views.forEach(v => { const r = v.c.getBoundingClientRect(); v.w = r.width; v.c.width = r.width * d; v.c.height = H * d; v.ctx.setTransform(d, 0, 0, d, 0, 0); }); }
window.addEventListener('resize', resize); resize();
let clock = 0, last = performance.now();
function pos(v, th) { const cx = v.w / 2, cy = H / 2, A = v.w * 0.36, B = H * 0.3; return [cx + A * Math.sin(th), cy + B * Math.sin(2 * th)]; }
function frame(now) {
  const dt = Math.min(50, now - last) / 1000; last = now; clock += dt;
  const sprint = (clock % 4) < 2.4; document.getElementById('state').textContent = sprint ? 'sprinting' : 'walking';
  views.forEach(v => {
    const ctx = v.ctx, spd = (sprint ? 225 : 150) * S;
    const [x0, y0] = pos(v, v.th), [x1, y1] = pos(v, v.th + 0.001); v.th += spd * dt / (Math.hypot(x1 - x0, y1 - y0) / 0.001);
    const [x, y] = pos(v, v.th), [xa, ya] = pos(v, v.th + 0.001), hd = Math.atan2(ya - y, xa - x);
    v.hist.push({ x, y, hd, t: clock, s: sprint }); while (v.hist.length && clock - v.hist[0].t > 0.6) v.hist.shift();
    ctx.fillStyle = '#0e1318'; ctx.fillRect(0, 0, v.w, H); ctx.strokeStyle = '#18212a'; ctx.lineWidth = 1;
    for (let gx = 0; gx < v.w; gx += 42) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    for (let gy = 0; gy < H; gy += 42) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(v.w, gy); ctx.stroke(); }
    const nx = -Math.sin(hd), ny = Math.cos(hd);
    if (v.k === 'dust') {
      // Approved: every ~50 ms a speed line at a random sideways offset behind the bot; ~1 in 3 also drops a dust puff.
      v.spawn -= dt;
      if (sprint && v.spawn <= 0) {
        v.spawn = 0.05; const lat = (Math.random() - 0.5) * 2 * R * 1.1;
        v.parts.push({ kind: 'line', x: x - Math.cos(hd) * R + nx * lat, y: y - Math.sin(hd) * R + ny * lat, hd, len: 8 + Math.random() * 12, t: 0 });
        if (Math.random() < 0.35) v.parts.push({ kind: 'dust', x: x - Math.cos(hd) * R * 0.8 + nx * (Math.random() - 0.5) * R, y: y - Math.sin(hd) * R * 0.8 + ny * (Math.random() - 0.5) * R, t: 0 });
      }
      v.parts = v.parts.filter(p => p.t < (p.kind === 'line' ? 0.22 : 0.5));
      v.parts.forEach(p => {
        p.t += dt;
        if (p.kind === 'line') { const k = p.t / 0.22, bx = p.x - Math.cos(p.hd) * k * 14, by = p.y - Math.sin(p.hd) * k * 14; ctx.strokeStyle = `rgba(226,232,240,${0.8 * (1 - k)})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - Math.cos(p.hd) * p.len, by - Math.sin(p.hd) * p.len); ctx.stroke(); }
        else { const k = p.t / 0.5; ctx.fillStyle = `rgba(148,163,184,${0.45 * (1 - k)})`; ctx.beginPath(); ctx.arc(p.x, p.y, 3 + 6 * k, 0, 7); ctx.fill(); }
      });
    }
    if (v.k === 'wind') {
      const pts = v.hist.filter(h => h.s && clock - h.t < 0.28);
      [[-0.75, 2], [0, 1.3], [0.75, 2]].forEach(([o, wd]) => { for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], age = (clock - b.t) / 0.28, off = o * R * (1 + age * 0.4); ctx.strokeStyle = `rgba(200,235,255,${(1 - age) * (o === 0 ? 0.35 : 0.75)})`; ctx.lineWidth = wd * (1 - age * 0.6); ctx.beginPath(); ctx.moveTo(a.x - Math.sin(a.hd) * off, a.y + Math.cos(a.hd) * off); ctx.lineTo(b.x - Math.sin(b.hd) * off, b.y + Math.cos(b.hd) * off); ctx.stroke(); } });
    }
    if (v.k === 'ghost') {
      [0.06, 0.12, 0.18].forEach((ago, i) => { let g = null; for (let j = v.hist.length - 1; j >= 0; j--) { if (clock - v.hist[j].t >= ago) { g = v.hist[j]; break; } } if (!g || !g.s) return; ctx.fillStyle = `rgba(87,184,255,${0.22 - i * 0.06})`; ctx.strokeStyle = `rgba(87,184,255,${0.45 - i * 0.12})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(g.x, g.y, R, 0, 7); ctx.fill(); ctx.stroke(); });
    }
    ctx.fillStyle = '#1c2733'; ctx.strokeStyle = '#57b8ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#57b8ff'; ctx.beginPath(); ctx.arc(x + Math.cos(hd) * R * 0.55, y + Math.sin(hd) * R * 0.55, 2.2, 0, 7); ctx.fill();
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
