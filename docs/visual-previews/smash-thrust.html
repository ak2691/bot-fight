<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smash and Thrust previews</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0b0f13; color: #e6edf3; font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; align-items: center; }
  button { background: transparent; color: #e6edf3; border: 1px solid #394049; border-radius: 5px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button.on { background: #12323d; border-color: #3aa6c9; color: #5fd4f0; }
  .muted { color: #8b98a5; font-size: 13px; }
  canvas { width: 100%; height: 300px; border-radius: 10px; display: block; }
  code { font-family: Cousine, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <p class="muted">Presentation preview only (plain canvas 2D, mirrors what the PixiJS renderers should draw). Units are arena units × 1.25. Bot radius 30. Approved: <b>Smash: cracks</b>. Thrust lance is a proposal, not approved yet.</p>
  <div class="row" id="modes"></div>
  <div class="row muted">Speed <span id="speeds" class="row" style="margin:0"></span><span id="phase" style="margin-left:auto;font-family:Cousine,monospace"></span></div>
  <canvas id="cv"></canvas>
  <p class="muted" id="cap"></p>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 680; const H = 300, S = 1.25, BX = 140, BY = 150, R = 30 * S;
function resize() { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; W = r.width; cv.width = W * d; cv.height = H * d; }
window.addEventListener('resize', resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
function rnd(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
// Fixed seeds: the crack and debris shapes are identical every time.
const r1 = rnd(7);
const CRACKS = [...Array(7)].map((_, i) => { let a = i * 2 * Math.PI / 7 + r1() * 0.5, pts = [[0, 0]], x = 0, y = 0; for (let k = 0; k < 4; k++) { a += (r1() - 0.5) * 0.8; const l = (9 + r1() * 8) * S; x += Math.cos(a) * l; y += Math.sin(a) * l; pts.push([x, y]); } return pts; });
const r2 = rnd(19);
const DEBRIS = [...Array(9)].map(() => ({ a: (r2() - 0.5) * 2.4, v: (70 + r2() * 110) * S, s: (3 + r2() * 4) * S, rot: r2() * 6 }));
const L = 125 * S, WD = 100 * S, TL = 190 * S, IP = L * 0.72;
function thrustFrac(p, e = 0.35, h = 0.3) { if (p <= 0) return 0; if (p < e) return p / e; if (p < e + h) return 1; if (p < 1) return 1 - (p - e - h) / (1 - e - h); return 0; }
function star(x, y, s, a, col) { ctx.save(); ctx.translate(x, y); ctx.fillStyle = col; ctx.globalAlpha = a; ctx.beginPath(); for (let i = 0; i < 8; i++) { const rr = i % 2 ? s * 0.25 : s, an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); } ctx.closePath(); ctx.fill(); ctx.restore(); }
function chevrons(x0, u, col) { ctx.strokeStyle = col; ctx.lineWidth = 3; for (let i = 0; i < 3; i++) { const x = x0 + 12 * S + i * 14 * S + u * 30 * S; ctx.globalAlpha = (1 - u) * (1 - i * 0.25); ctx.beginPath(); ctx.moveTo(x, -10 * S); ctx.lineTo(x + 8 * S, 0); ctx.lineTo(x, 10 * S); ctx.stroke(); } ctx.globalAlpha = 1; }
function cracks(growth, alpha) {
  ctx.strokeStyle = `rgba(15,23,42,${alpha})`; ctx.lineWidth = 3;
  CRACKS.forEach(c => { ctx.beginPath(); const n = Math.ceil(growth * (c.length - 1)); ctx.moveTo(IP, 0); for (let k = 1; k <= n; k++) ctx.lineTo(IP + c[k][0], c[k][1]); ctx.stroke(); });
  ctx.strokeStyle = `rgba(148,163,184,${alpha * 0.6})`; ctx.lineWidth = 1;
  CRACKS.forEach(c => { ctx.beginPath(); const n = Math.ceil(growth * (c.length - 1)); ctx.moveTo(IP, 0); for (let k = 1; k <= n; k++) ctx.lineTo(IP + c[k][0] + 1, c[k][1] + 1); ctx.stroke(); });
}
const MODES = {
  smashNow: { label: 'Smash: current', w: 300, a: 300, dummy: 150, hitAt: 0, kb: true,
    cap: 'Today: an outlined box during the wind-up, then a white flash, one impact line and three grey dots.',
    draw(layer, st) {
      if (layer === 'under' && st.ph === 'windup') { ctx.strokeStyle = `rgba(226,232,240,${0.15 + 0.6 * st.p})`; ctx.lineWidth = 3; ctx.strokeRect(0, -WD / 2, L, WD); }
      if (layer === 'over' && st.ph === 'active') {
        const q = st.p; ctx.fillStyle = `rgba(226,232,240,${0.5 * (1 - q)})`; ctx.fillRect(0, -WD / 2, L, WD);
        ctx.strokeStyle = `rgba(255,255,255,${1 - q})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(L, -WD / 2 + 8); ctx.lineTo(L, WD / 2 - 8); ctx.stroke();
        for (let i = 0; i < 3; i++) { const lane = i - 1; ctx.fillStyle = `rgba(148,163,184,${(1 - q) * 0.8})`; ctx.beginPath(); ctx.arc(L + (10 + 30 * q) * S, lane * (WD * 0.4 + 25 * q * S), (8 + 8 * q) * S, 0, 7); ctx.fill(); }
      }
    } },
  smashNew: { label: 'Smash: cracks (approved)', w: 300, a: 300, dummy: 150, hitAt: 0, kb: true,
    cap: 'Approved. Wind-up: faint box fill, dashed outline, and a shadow at 72% of the length that grows and darkens. Active: flash, shockwave ring, 7 cracks (fully grown in the first 12%), debris thrown forward, 3 amber chevrons. Cracks and dust linger 700 ms after active on the presentation clock. No hammer, no screen shake.',
    draw(layer, st) {
      if (layer === 'under') {
        if (st.ph === 'windup') {
          const p = st.p;
          ctx.fillStyle = `rgba(226,232,240,${0.04 + 0.1 * p})`; ctx.fillRect(0, -WD / 2, L, WD);
          ctx.setLineDash([6, 5]); ctx.strokeStyle = `rgba(226,232,240,${0.25 + 0.35 * p})`; ctx.lineWidth = 2; ctx.strokeRect(0, -WD / 2, L, WD); ctx.setLineDash([]);
          ctx.fillStyle = `rgba(0,0,0,${0.15 + 0.4 * p})`; ctx.beginPath(); ctx.ellipse(IP, 0, (14 + 14 * p) * S, (18 + 16 * p) * S, 0, 0, 7); ctx.fill();
        }
        if (st.ph === 'active') cracks(Math.min(1, st.p / 0.12), 0.8);
        if (st.ph === 'after') cracks(1, 0.8 * (1 - st.e / 700));
      }
      if (layer === 'over') {
        if (st.ph === 'active') {
          const u = st.p;
          ctx.fillStyle = `rgba(255,255,255,${0.45 * Math.pow(1 - u, 3)})`; ctx.fillRect(0, -WD / 2, L, WD);
          ctx.fillStyle = `rgba(255,236,200,${0.6 * Math.pow(1 - u, 2)})`; ctx.beginPath(); ctx.arc(IP, 0, (10 + 22 * easeOut(u * 2)) * S, 0, 7); ctx.fill();
          ctx.strokeStyle = `rgba(255,255,255,${1 - u})`; ctx.lineWidth = 6 * (1 - u) + 1; ctx.beginPath(); ctx.ellipse(IP, 0, (18 + 70 * u) * S * 0.8, (18 + 70 * u) * S, 0, 0, 7); ctx.stroke();
          DEBRIS.forEach(d => { const dist = d.v * easeOut(u); ctx.save(); ctx.translate(IP + Math.cos(d.a) * dist, Math.sin(d.a) * dist); ctx.rotate(d.rot + u * 6); ctx.fillStyle = `rgba(148,163,184,${1 - u})`; ctx.fillRect(-d.s / 2, -d.s / 2, d.s, d.s); ctx.restore(); });
          chevrons(L, u, '#fde68a');
        }
        if (st.ph === 'after') {
          const a = 0.5 * (1 - st.e / 700);
          for (let i = 0; i < 4; i++) { ctx.fillStyle = `rgba(148,163,184,${a * 0.6})`; ctx.beginPath(); ctx.arc(IP + (i - 1.5) * 14 * S, (i % 2 ? 1 : -1) * 10 * S - st.e * 0.01, (9 + st.e * 0.012) * S, 0, 7); ctx.fill(); }
        }
      }
    } },
  thrustNow: { label: 'Thrust: current', w: 100, a: 300, dummy: 220, hitAt: 0.3, kb: false,
    cap: 'Today: a 4 px line pulls back, then extends with a small triangle tip.',
    draw(layer, st) {
      if (layer !== 'over') return; ctx.strokeStyle = '#cbd5e1'; ctx.fillStyle = '#cbd5e1'; ctx.lineWidth = 4;
      if (st.ph === 'windup') { const f = R - 40 * S * st.p; ctx.beginPath(); ctx.moveTo(f - 40 * S, 0); ctx.lineTo(f, 0); ctx.stroke(); }
      if (st.ph === 'active') { const end = Math.max(R, TL * thrustFrac(st.p)); ctx.beginPath(); ctx.moveTo(R * 0.6, 0); ctx.lineTo(end - 14 * S, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(end, 0); ctx.lineTo(end - 14 * S, -8 * S); ctx.lineTo(end - 14 * S, 8 * S); ctx.fill(); }
    } },
  thrustNew: { label: 'Thrust: lance (proposal)', w: 100, a: 300, dummy: 220, hitAt: 0.3, kb: false,
    cap: 'Proposal, not approved yet: a lance with a tapered shaft and a diamond head, a glint and faint aim line during the wind-up, speed streaks while extending, and a tip flash at full reach.',
    draw(layer, st) {
      const lance = (tip, a) => { ctx.save(); ctx.globalAlpha = a; const hl = 30 * S, base = Math.min(R * 0.4, tip - hl - 4); ctx.fillStyle = '#8a94a6'; ctx.beginPath(); ctx.moveTo(base, -3.5 * S); ctx.lineTo(tip - hl, -2.2 * S); ctx.lineTo(tip - hl, 2.2 * S); ctx.lineTo(base, 3.5 * S); ctx.fill(); ctx.fillStyle = '#475569'; ctx.fillRect(tip - hl - 4 * S, -5 * S, 4 * S, 10 * S); ctx.fillStyle = '#e2e8f0'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(tip, 0); ctx.lineTo(tip - hl * 0.45, -6.5 * S); ctx.lineTo(tip - hl, 0); ctx.lineTo(tip - hl * 0.45, 6.5 * S); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(tip - 2, 0); ctx.lineTo(tip - hl + 3, 0); ctx.stroke(); ctx.restore(); };
      if (layer === 'under' && st.ph === 'windup') { ctx.setLineDash([4, 6]); ctx.strokeStyle = `rgba(203,213,225,${0.12 + 0.3 * st.p})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(R, 0); ctx.lineTo(TL, 0); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = `rgba(203,213,225,${0.06 * st.p})`; ctx.fillRect(R, -15 * S, TL - R, 30 * S); }
      if (layer === 'over') {
        if (st.ph === 'windup') { const tip = R + 34 * S - 30 * S * st.p; lance(tip, 1); star(tip - 4, 0, (6 + 6 * st.p) * S, st.p, '#ffffff'); }
        if (st.ph === 'idle') lance(R + 34 * S, 1);
        if (st.ph === 'active') {
          const q = st.p, tip = Math.max(R + 34 * S, TL * thrustFrac(q));
          if (q < 0.35) { ctx.strokeStyle = `rgba(226,232,240,${0.7 * (1 - q / 0.35)})`; ctx.lineWidth = 1.5; [-10, 10].forEach(y => { ctx.beginPath(); ctx.moveTo(tip - 70 * S, y * S); ctx.lineTo(tip - 26 * S, y * S * 0.6); ctx.stroke(); }); }
          lance(tip, 1);
          if (q >= 0.35 && q < 0.65) { const h = (q - 0.35) / 0.3; star(tip, 0, (10 + 10 * h) * S, 1 - h, '#ffffff'); ctx.strokeStyle = `rgba(255,255,255,${1 - h})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(tip, 0, (6 + 16 * h) * S, 0, 7); ctx.stroke(); }
        }
        if (st.ph === 'after') lance(R + 34 * S, Math.min(1, st.e / 150));
      }
    } },
};
let mode = 'smashNew', speed = 1, t = 0, last = performance.now();
const btns = {};
Object.entries(MODES).forEach(([k, m]) => { const b = document.createElement('button'); b.textContent = m.label; b.onclick = () => { mode = k; t = 0; Object.entries(btns).forEach(([kk, bb]) => bb.classList.toggle('on', kk === mode)); document.getElementById('cap').textContent = m.cap; }; btns[k] = b; document.getElementById('modes').appendChild(b); b.classList.toggle('on', k === mode); });
const sbtns = []; [1, 0.5, 0.25].forEach(v => { const b = document.createElement('button'); b.textContent = v + 'x'; b.onclick = () => { speed = v; sbtns.forEach(x => x.classList.toggle('on', x === b)); }; sbtns.push(b); document.getElementById('speeds').appendChild(b); b.classList.toggle('on', v === 1); });
document.getElementById('cap').textContent = MODES[mode].cap;
function body(x, y, stroke, fill) { ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill(); ctx.stroke(); }
function frame(now) {
  const dt = Math.min(50, now - last); last = now; t += dt * speed;
  const m = MODES[mode], IDLE = 500, AFTER = 700, tot = IDLE + m.w + m.a + AFTER, tt = t % tot; let st;
  if (tt < IDLE) st = { ph: 'idle', p: tt / IDLE }; else if (tt < IDLE + m.w) st = { ph: 'windup', p: (tt - IDLE) / m.w }; else if (tt < IDLE + m.w + m.a) st = { ph: 'active', p: (tt - IDLE - m.w) / m.a }; else st = { ph: 'after', p: 1, e: tt - IDLE - m.w - m.a };
  document.getElementById('phase').textContent = st.ph === 'after' ? 'after active' : st.ph;
  const d = window.devicePixelRatio || 1; ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.fillStyle = '#0e1318'; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = '#18212a'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50 * S) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 50 * S) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.save(); ctx.translate(BX, BY);
  const hitP = st.ph === 'active' && st.p >= m.hitAt ? (st.p - m.hitAt) / (1 - m.hitAt) : st.ph === 'after' ? 1 : 0;
  const kbx = m.kb ? 120 * S * easeOut(Math.min(1, hitP * 1.6)) : 0;
  const justHit = st.ph === 'active' && st.p >= m.hitAt && st.p < m.hitAt + 0.35;
  m.draw('under', st);
  body(m.dummy * S + kbx, 0, '#ff7166', justHit ? '#7a2a24' : '#2a1a1c');
  body(0, 0, '#57b8ff', '#1c2733'); ctx.fillStyle = '#57b8ff'; ctx.fillRect(R * 0.3, -R * 0.35, R * 0.18, R * 0.18); ctx.fillRect(R * 0.3, R * 0.17, R * 0.18, R * 0.18);
  m.draw('over', st); ctx.restore(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
